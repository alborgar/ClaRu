<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --cyan: #32a9f1;
            --red: #ff3131;
            --magenta: #d661a8;
            --green: #60af5d;
            --orange: #ff7b32;
            --gray: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--black);
            padding: 20px;
        }

        header {
            background-color: var(--black);
            color: var(--white);
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        /* CONFIGURACIÓN DE COLUMNAS DESIGUALES */
        #guestbook {
            column-count: 5; /* 5 columnas */
            column-gap: 20px; /* Espacio entre columnas */
            width: 100%;
        }

        .review {
            /* Esto evita que una reseña se parta entre dos columnas */
            break-inside: avoid;
            margin-bottom: 20px; /* Espacio vertical entre reseñas */
            padding: 25px;
            display: flex;
            flex-direction: column;
            border: 2px solid var(--black);
        }

        .comment {
            font-size: 1.15rem;
            line-height: 1.2;
            margin-bottom: 20px;
            text-transform: none;
        }

        /* ESTILOS PARA EL CONTENEDOR DEL VÍDEO Y LA FOTO */
        .review-video, .review-image {
            width: 100%;
            margin-bottom: 20px;
            border: 2px solid var(--black);
            display: block;
        }

        .author {
            font-size: 0.85rem;
            text-transform: uppercase;
            background: var(--black);
            color: var(--white);
            display: inline-block;
            padding: 5px 10px;
            align-self: flex-start;
        }

        /* COLORES DE LA IMAGEN */
        .bg-cyan { background-color: var(--cyan); }
        .bg-red { background-color: var(--red); }
        .bg-magenta { background-color: var(--magenta); }
        .bg-green { background-color: var(--green); }
        .bg-orange { background-color: var(--orange); }

        /* RESPONSIVE */
        @media (max-width: 1400px) { #guestbook { column-count: 4; } }
        @media (max-width: 1100px) { #guestbook { column-count: 3; } }
        @media (max-width: 800px) { #guestbook { column-count: 2; } }
        @media (max-width: 500px) { 
            #guestbook { column-count: 1; }
            h1 { font-size: 1.6rem; }
        }
    </style>

        const colors = ['bg-cyan', 'bg-red', 'bg-magenta', 'bg-green', 'bg-orange'];
        const container = document.getElementById('guestbook');

        // Función para mezclar colores de forma aleatoria (Fisher-Yates shuffle)
        function getRandomColor(lastColor) {
            let availableColors = colors.filter(c => c !== lastColor);
            return availableColors[Math.floor(Math.random() * availableColors.length)];
        }

        function loadReviews() {
            let lastColor = "";
            reviews.forEach((r) => {
                const div = document.createElement('div');
                const currentColor = getRandomColor(lastColor);
                lastColor = currentColor;
                
                div.className = `review ${currentColor}`;
                
                // Lógica para inyectar la etiqueta de vídeo o imagen si existe
                let mediaHTML = "";
                if (r.video) {
                    // Comprobamos si el archivo termina en una extensión de imagen común
                    const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(r.video);
                    if (isImage) {
                        mediaHTML = `<img class="review-image" src="${r.video}" alt="Foto de ${r.nombre}">`;
                    } else {
                        mediaHTML = `<video class="review-video" controls><source src="${r.video}" type="video/mp4">Tu navegador no soporta vídeos.</video>`;
                    }
                }

                div.innerHTML = `
                    <div class="comment">${r.texto}</div>
                    ${mediaHTML}
                    <div class="author">${r.nombre}</div>
                `;
                container.appendChild(div);
            });
        }
